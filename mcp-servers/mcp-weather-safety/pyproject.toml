[project]
name = "mcp-weather-safety"
version = "0.1.0"
description = "MCP Server dla IMGW-PIB oraz Open-Meteo - taktyczna ocena wiatru i wektora zadymienia dla Straży Pożarnej (OSP/PSP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-weather-safety = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
