[project]
name = "mcp-geoportal"
version = "0.1.0"
description = "MCP Server dla GUGiK / Geoportal.gov.pl - rozpoznanie infrastruktury terenu dla Straży Pożarnej (OSP/PSP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyproj>=3.6.0",
]

[project.scripts]
mcp-geoportal = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
