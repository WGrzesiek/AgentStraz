[project]
name = "mcp-osm-fire-recon"
version = "0.1.0"
description = "MCP Server dla OpenStreetMap Overpass API - zaopatrzenie wodne, hydranty, cieki i drogi pożarowe dla Straży Pożarnej (OSP/PSP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-osm-fire-recon = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
